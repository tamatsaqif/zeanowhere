<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zeanowhere</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Background Seashore -->
    <div class="seashore-bg" id="seashoreBg">
        <div class="ocean-gradient"></div>
        <div class="wave-ripple" id="waveRipple"></div>
        <div class="wave-ripple wave-ripple-2" id="waveRipple2"></div>
        <div class="wave-ripple wave-ripple-3" id="waveRipple3"></div>
        <canvas id="waveCanvas"></canvas>
    </div>

    <div class="container">

        <!-- Profil -->
        <div class="profile">
            <img src="https://cdn.phototourl.com/free/2026-09-03-ad28ea97-7183-4f60-b355-e081d6026bed.jpg" alt="Foto Profil" class="profile-img" />
            <h1 class="name">zeann</h1>
            <p class="bio">@z.zayyant</p>
        </div>

        <!-- Menu Link — 5 KOTAK (Instagram, Discord, TikTok, Zean Album, Songfess) -->
        <div class="menu-grid">
            
            <!-- Instagram -->
            <a href="https://www.instagram.com/nath.isme/" target="_blank" class="menu-item">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" class="icon-img" width="32" height="32" />
                <span class="label">Instagram</span>
                <span class="equals">=</span>
                <div class="glass-glow"></div>
            </a>

            <!-- Discord -->
            <a href="http://dsc.gg/tinggi-badan" target="_blank" class="menu-item">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg" alt="Discord" class="icon-img" width="32" height="32" />
                <span class="label">Discord</span>
                <span class="equals">=</span>
                <div class="glass-glow"></div>
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@z.zayyant" target="_blank" class="menu-item">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg" alt="TikTok" class="icon-img" width="32" height="32" />
                <span class="label">TikTok</span>
                <span class="equals">=</span>
                <div class="glass-glow"></div>
            </a>

            <!-- Zean Album (BARU) — ICON PHOTO/GALLERY -->
            <a href="https://zeanalbum.netlify.app" target="_blank" class="menu-item">
                <svg class="icon-img" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <span class="label">Zean Album</span>
                <span class="equals">=</span>
                <div class="glass-glow"></div>
            </a>

            <!-- Songfess -->
            <a href="https://songfess-app.vercel.app" target="_blank" rel="noopener noreferrer" class="menu-item">
                <svg class="icon-img" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 18V5l11-2v13" />
                    <circle cx="6" cy="18" r="3" />
                    <circle cx="17" cy="16" r="3" />
                </svg>
                <span class="label">Songfess</span>
                <span class="equals">=</span>
                <div class="glass-glow"></div>
            </a>

        </div>

        <!-- Footer -->
        <p class="footer">© 2026 • Semua link tersedia</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
